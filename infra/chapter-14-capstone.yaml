AWSTemplateFormatVersion: '2010-09-09'
Description: Disabled-by-default Chapter 14 controlled non-production capstone evidence skeleton
Parameters:
  DeployChapter14Capstone:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Conditions:
  DeployChapter14: !Equals [!Ref DeployChapter14Capstone, 'true']
Resources:
  CapstoneEvidenceKey:
    Type: AWS::KMS::Key
    Condition: DeployChapter14
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Chapter 14 capstone evidence key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  CapstoneEvidenceBucket:
    Type: AWS::S3::Bucket
    Condition: DeployChapter14
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: {Mode: COMPLIANCE, Days: 400}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CapstoneEvidenceKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
  CapstoneEvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DeployChapter14
    Properties:
      Bucket: !Ref CapstoneEvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CapstoneEvidenceBucket.Arn
              - !Sub '${CapstoneEvidenceBucket.Arn}/*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Sid: DenyUnencryptedWrites
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${CapstoneEvidenceBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: DenyWrongKmsKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${CapstoneEvidenceBucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt CapstoneEvidenceKey.Arn
