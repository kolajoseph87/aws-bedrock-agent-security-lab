AWSTemplateFormatVersion: '2010-09-09'
Description: Guarded Chapter 11 incident-response reference; disabled by default.
Parameters:
  DeployChapter11IncidentResponse:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  SecurityAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
  EvidenceArchiveArn:
    Type: String
    Description: ARN of a separately managed security-account bucket with KMS, Object Lock compliance mode, legal hold, and CloudTrail log-file validation.
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):s3:::[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
Conditions:
  Deploy: !Equals [!Ref DeployChapter11IncidentResponse, 'true']
Resources:
  IncidentStateTable:
    Type: AWS::DynamoDB::Table
    Condition: Deploy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: scope
          AttributeType: S
      KeySchema:
        - AttributeName: scope
          KeyType: HASH
  RevocationTable:
    Type: AWS::DynamoDB::Table
    Condition: Deploy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: authorization_id
          AttributeType: S
      KeySchema:
        - AttributeName: authorization_id
          KeyType: HASH
  IncidentTopic:
    Type: AWS::SNS::Topic
    Condition: Deploy
    Properties:
      KmsMasterKeyId: alias/aws/sns
  IncidentEventRule:
    Type: AWS::Events::Rule
    Condition: Deploy
    Properties:
      State: ENABLED
      EventPattern:
        source: [northstar.agent-security]
        detail-type: [Agent Security Incident]
      Targets:
        - Arn: !Ref IncidentTopic
          Id: IncidentNotification
  ResponseRole:
    Type: AWS::IAM::Role
    Condition: Deploy
    Properties:
      MaxSessionDuration: 900
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${SecurityAccountId}:root
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
              StringEquals:
                sts:ExternalId: northstar-incident-response
      Policies:
        - PolicyName: IncidentStateOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt IncidentStateTable.Arn
                  - !GetAtt RevocationTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectRetention
                  - s3:PutObjectLegalHold
                Resource: !Sub ${EvidenceArchiveArn}/chapter-11/*
              - Effect: Deny
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - codecommit:GitPush
                  - codepipeline:StartPipelineExecution
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - cloudtrail:StopLogging
                  - cloudtrail:DeleteTrail
                Resource: '*'
Outputs:
  DeploymentEnabled:
    Value: !Ref DeployChapter11IncidentResponse
  LiveEnforcementRequired:
    Value: Consumers must query the incident state before every protected action; this skeleton does not retrofit enforcement into existing workloads.
