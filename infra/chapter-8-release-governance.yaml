AWSTemplateFormatVersion: '2010-09-09'
Description: Guarded Chapter 8 release-governance reference. Disabled by default.
Parameters:
  DeployChapter8ReleaseGovernance:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ArtifactBucketName:
    Type: String
    Default: ''
  ArtifactKmsKeyArn:
    Type: String
    Default: ''
  ApprovedBuildImage:
    Type: String
    Default: 'REPLACE_WITH_APPROVED_ECR_IMAGE_AT_SHA256_DIGEST'
  ApprovedOidcProviderArn:
    Type: String
    Default: ''
  ApprovedOidcAudience:
    Type: String
    Default: 'sts.amazonaws.com'
  ApprovedOidcSubject:
    Type: String
    Default: 'REPLACE_WITH_EXACT_REPOSITORY_ENVIRONMENT_SUBJECT'
Conditions:
  DeployChapter8ReleaseGovernanceCondition: !Equals [!Ref DeployChapter8ReleaseGovernance, 'true']
Resources:
  ReleasePipelineRole:
    Type: AWS::IAM::Role
    Condition: DeployChapter8ReleaseGovernanceCondition
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codepipeline.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: ExactEncryptedArtifactStore
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/chapter-8/*
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !Ref ArtifactKmsKeyArn
  BuildRole:
    Type: AWS::IAM::Role
    Condition: DeployChapter8ReleaseGovernanceCondition
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: ExplicitProductionDeny
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action: ['cloudformation:*', 'codedeploy:*', 'ecs:UpdateService', 'lambda:UpdateFunctionCode']
                Resource: '*'
  ProductionDeploymentRole:
    Type: AWS::IAM::Role
    Condition: DeployChapter8ReleaseGovernanceCondition
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ApprovedOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: !Ref ApprovedOidcAudience
                token.actions.githubusercontent.com:sub: !Ref ApprovedOidcSubject
      Policies:
        - PolicyName: ReferenceDeploymentBoundary
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action:
                  - iam:*
                  - organizations:*
                  - account:*
                Resource: '*'
  VerificationProject:
    Type: AWS::CodeBuild::Project
    Condition: DeployChapter8ReleaseGovernanceCondition
    Properties:
      ServiceRole: !GetAtt BuildRole.Arn
      Source: {Type: CODEPIPELINE}
      Artifacts: {Type: CODEPIPELINE}
      EncryptionKey: !Ref ArtifactKmsKeyArn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref ApprovedBuildImage
        ImagePullCredentialsType: SERVICE_ROLE
        PrivilegedMode: false
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 15
      LogsConfig:
        CloudWatchLogs: {Status: ENABLED}
Outputs:
  DeploymentStatus:
    Value: !If [DeployChapter8ReleaseGovernanceCondition, guarded-reference-created, disabled-no-resources]
