AWSTemplateFormatVersion: '2010-09-09'
Description: Guarded Chapter 4 identity reference for the Northstar synthetic development lab.

Parameters:
  DeployChapter4IdentitySecurity:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Keep false unless an approved change set and live security review authorize role creation.
  PermissionsBoundaryArn:
    Type: String
    Default: arn:aws:iam::111122223333:policy/REPLACE-WITH-APPROVED-BOUNDARY
    AllowedPattern: '^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+$'
  ApprovedSourceAccount:
    Type: String
    Default: '111122223333'
    AllowedPattern: '^[0-9]{12}$'
  ApprovedBedrockAgentArn:
    Type: String
    Default: arn:aws:bedrock:us-east-1:111122223333:agent/REPLACE123
  ApprovedCodeBuildProjectArn:
    Type: String
    Default: arn:aws:codebuild:us-east-1:111122223333:project/replace-with-approved-project
  ApprovedCodePipelineArn:
    Type: String
    Default: arn:aws:codepipeline:us-east-1:111122223333:replace-with-approved-pipeline

Conditions:
  DeployIdentitySecurity: !Equals [!Ref DeployChapter4IdentitySecurity, 'true']

Resources:
  SecureCodingAgentRole:
    Type: AWS::IAM::Role
    Condition: DeployIdentitySecurity
    Properties:
      RoleName: northstar-dev-secure-coding-agent
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref ApprovedSourceAccount
              ArnEquals:
                aws:SourceArn: !Ref ApprovedBedrockAgentArn
      Tags:
        - Key: northstar:environment
          Value: development
        - Key: northstar:application
          Value: secure-coding-agent
        - Key: northstar:data-classification
          Value: synthetic-only

  IsolatedPatchWorkerRole:
    Type: AWS::IAM::Role
    Condition: DeployIdentitySecurity
    Properties:
      RoleName: northstar-dev-isolated-patch-worker
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref ApprovedSourceAccount
              ArnEquals:
                aws:SourceArn: !Ref ApprovedCodeBuildProjectArn
      Tags:
        - Key: northstar:environment
          Value: development
        - Key: northstar:application
          Value: isolated-patch-worker
        - Key: northstar:data-classification
          Value: synthetic-only

  CicdSecurityGateRole:
    Type: AWS::IAM::Role
    Condition: DeployIdentitySecurity
    Properties:
      RoleName: northstar-dev-cicd-security-gate
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref ApprovedSourceAccount
              ArnEquals:
                aws:SourceArn: !Ref ApprovedCodePipelineArn
      Tags:
        - Key: northstar:environment
          Value: development
        - Key: northstar:application
          Value: cicd-security-gate
        - Key: northstar:data-classification
          Value: synthetic-only

Outputs:
  DeploymentStatus:
    Value: !If
      - DeployIdentitySecurity
      - Guarded role skeletons were requested; inspect stack events and effective policies.
      - No Chapter 4 resources were requested.
