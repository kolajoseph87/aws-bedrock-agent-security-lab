AWSTemplateFormatVersion: '2010-09-09'
Description: Guarded Chapter 9 observability reference. Disabled by default.
Parameters:
  DeployChapter9Observability:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  SecurityLogKmsKeyArn:
    Type: String
    Default: ''
  SecurityAlertTopicArn:
    Type: String
    Default: ''
  SecurityDeliveryStreamArn:
    Type: String
    Default: ''
Conditions:
  DeployChapter9ObservabilityCondition: !Equals [!Ref DeployChapter9Observability, 'true']
Resources:
  SecurityArchiveBucket:
    Type: AWS::S3::Bucket
    Condition: DeployChapter9ObservabilityCondition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref SecurityLogKmsKeyArn
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Days: 400
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
  SecurityAuditLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployChapter9ObservabilityCondition
    Properties:
      LogGroupName: /northstar/nonprod/agent/security-audit
      KmsKeyId: !Ref SecurityLogKmsKeyArn
      RetentionInDays: 400
  SecurityAuditDeliveryRole:
    Type: AWS::IAM::Role
    Condition: DeployChapter9ObservabilityCondition
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: logs.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/northstar/nonprod/agent/security-audit:*
      Policies:
        - PolicyName: ExactSecurityDeliveryStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [firehose:PutRecord, firehose:PutRecordBatch]
                Resource: !Ref SecurityDeliveryStreamArn
  SecurityAuditSubscription:
    Type: AWS::Logs::SubscriptionFilter
    Condition: DeployChapter9ObservabilityCondition
    Properties:
      DestinationArn: !Ref SecurityDeliveryStreamArn
      FilterPattern: ''
      LogGroupName: !Ref SecurityAuditLogGroup
      RoleArn: !GetAtt SecurityAuditDeliveryRole.Arn
  RuntimeDenialMetric:
    Type: AWS::Logs::MetricFilter
    Condition: DeployChapter9ObservabilityCondition
    Properties:
      LogGroupName: !Ref SecurityAuditLogGroup
      FilterPattern: '{ $.decision = "DENY" }'
      MetricTransformations:
        - MetricNamespace: Northstar/AgentSecurity
          MetricName: RuntimeDenials
          MetricValue: '1'
  RuntimeDenialAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: DeployChapter9ObservabilityCondition
    Properties:
      Namespace: Northstar/AgentSecurity
      MetricName: RuntimeDenials
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref SecurityAlertTopicArn]
Outputs:
  DeploymentStatus:
    Value: !If [DeployChapter9ObservabilityCondition, guarded-reference-created, disabled-no-resources]
